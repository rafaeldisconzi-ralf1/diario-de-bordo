<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f2a33;font-family:B;color:#f4f3ee}
#bg{position:absolute;inset:-200px;background:#0f2a33;background-image:linear-gradient(rgba(244,243,238,.06) 2px,transparent 2px),linear-gradient(90deg,rgba(244,243,238,.06) 2px,transparent 2px);background-size:90px 90px}
.abs{position:absolute;opacity:0}
.yel{color:#f2b705}.grn{color:#5fd39a}.red{color:#ff7a66}
#hook{left:50px;right:50px;top:520px;text-align:center;font:800 150px/.95 BC;text-transform:uppercase}
#hook b{display:inline-block;background:#f2b705;color:#16181b;padding:6px 34px 0;margin-top:22px;font-size:190px;white-space:nowrap;transform:rotate(-2deg)}
#hook2{left:50px;right:50px;top:1300px;text-align:center;font:800 120px/1 BC;text-transform:uppercase}
#title{left:40px;right:40px;top:130px;text-align:center;font:800 96px/1 BC;text-transform:uppercase}
.card{width:470px;height:1100px;top:420px;border-radius:40px;background:#16181b;box-shadow:0 22px 0 rgba(0,0,0,.35);padding:34px 30px;border:0 solid #5fd39a}
.card .hd{display:flex;align-items:center;gap:22px}
.badge{width:110px;height:110px;border-radius:24px;background:#f2b705;color:#16181b;font:800 100px/1 BC;display:flex;align-items:center;justify-content:center;padding-top:8px}
.card .km{font:800 84px/1 BC;text-transform:uppercase}
.card .bruto{margin-top:24px;font:700 38px B;text-transform:uppercase;color:#c9c5ba;letter-spacing:1px}
.card .bv{font:800 120px/1 BC}
.row{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px;padding-top:14px;border-top:4px solid #2b3138;opacity:0}
.row .n{font:700 34px B;text-transform:uppercase;color:#c9c5ba;letter-spacing:1px}
.row .v{font:800 66px/1 BC;color:#ff7a66;white-space:nowrap}
.sob{position:absolute;left:30px;right:30px;bottom:34px;border-top:8px solid #f2b705;padding-top:16px;text-align:center}
.sob .l{font:800 54px/1 BC;text-transform:uppercase;color:#c9c5ba}
.sob .v{font:800 120px/1 BC;white-space:nowrap}
#tag{left:30px;right:30px;top:1580px;text-align:center;font:800 92px/1 BC;text-transform:uppercase}
#end{position:absolute;inset:0;background:#16181b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0}
#ico{width:260px;height:260px;border-radius:56px}
#en{font:800 120px BC;text-transform:uppercase}
#el{font:800 92px/1.05 BC;text-transform:uppercase;text-align:center}
#ep{background:#f2b705;color:#16181b;font:800 96px BC;padding:24px 70px 16px;border-radius:999px;text-transform:uppercase}
#wm{position:absolute;left:0;right:0;top:70px;text-align:center;font:700 36px B;color:#fff;opacity:.7;letter-spacing:1px}
#ex{left:0;right:0;top:1810px;text-align:center;font:700 32px B;color:#c9c5ba;text-transform:uppercase;letter-spacing:2px}
</style></head><body>
<div id="bg"></div><div id="wm">@appdiariodebordo</div>
<div class="abs" id="hook">Esse frete paga<br><b>R$ 9.000</b></div>
<div class="abs" id="hook2">Mas <span class="yel">sobra</span> quanto?</div>
<div class="abs" id="title">Mesmo frete.<br><span class="yel">Sobra igual?</span></div>
<div class="abs card" id="cA" style="left:50px"></div>
<div class="abs card" id="cB" style="left:560px"></div>
<div class="abs" id="tag"></div>
<div class="abs" id="ex">números de exemplo</div>
<div id="end"><img id="ico" src="icon-512.png"><div id="en">Diário de Bordo</div>
 <div id="el">Não é o frete que paga.<br>É o que <span class="grn">sobra</span></div><div id="ep">Toque em Saiba mais</div>
 <div style="font:700 44px B;text-transform:uppercase;color:#c9c5ba;letter-spacing:1px">7 dias de garantia</div></div>
<script>
const TOT=22;
const $=s=>document.querySelector(s);
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const D={A:{km:'1.100 km',rows:[['Diesel',3300],['Pedágio',640],['Diária',0],['Comida',280]]},
         B:{km:'700 km',rows:[['Diesel',2100],['Pedágio',150],['Diária',400],['Comida',180]]}};
const RT=[4.6,6.4,8.2,10.0]; // quando cada linha cai
['A','B'].forEach(k=>{const d=D[k];$('#c'+k).innerHTML='<div class="hd"><div class="badge">'+k+'</div><div class="km">'+d.km+'</div></div><div class="bruto">Frete bruto</div><div class="bv">R$ 9.000</div>'+
 d.rows.map(r=>'<div class="row"><span class="n">'+r[0]+'</span><span class="v">'+(r[1]?'- '+fmt(r[1]):'R$ 0')+'</span></div>').join('')+
 '<div class="sob"><div class="l" id="l'+k+'">Sobrou até agora</div><div class="v" id="s'+k+'">R$ 9.000</div></div>'});
window.render=function(t){
 $('#bg').style.transform='translate('+(-(t*18)%90)+'px,'+(-(t*10)%90)+'px)';
 // gancho
 const h=$('#hook');h.style.opacity=cl(t/.15)*(1-cl((t-3.5)/.2));h.style.transform='scale('+(.85+.15*back(t/.4))+')';
 const h2=$('#hook2');const a2=cl((t-1.3)/.2)*(1-cl((t-3.5)/.2));h2.style.opacity=a2;h2.style.transform='scale('+(.8+.2*back((t-1.3)/.35))+')';
 // título + cartões
 const ti=$('#title');ti.style.opacity=cl((t-3.6)/.2)*(1-cl((t-11.6)/.2));
 ['A','B'].forEach((k,i)=>{const c=$('#c'+k);const a=3.8+i*.25;const o=cl((t-a)/.2);c.style.opacity=(t<16.2?o:1)*(t>19?1-cl((t-19)/.2):1);
  c.style.transform='translateY('+((1-eo((t-a)/.4))*80)+'px) scale('+(.85+.15*back((t-a)/.4))+')';
  const d=D[k];let left=9000;const rows=c.querySelectorAll('.row');
  d.rows.forEach((r,j)=>{const p=cl((t-RT[j])/.35);rows[j].style.opacity=p;rows[j].style.transform='translateX('+((1-eo((t-RT[j])/.35))*60)+'px)';if(t>=RT[j])left-=r[1]*eo((t-RT[j])/.5);});
  $('#s'+k).textContent=fmt(left);
  // resultado
  const fin=t>=12.2;$('#l'+k).textContent=fin?'SOBROU':'Sobrou até agora';
  const win=k=='B'&&t>=13.5;const w=win?eo((t-13.5)/.4):0;c.style.borderWidth=(12*w)+'px';
  $('#s'+k).className='v '+(fin?(k=='B'?'grn':'yel'):'');
  if(win)c.style.transform+=' scale('+(1+.04*w)+')';
  if(k=='A'&&t>=13.5)c.style.opacity=(t<16.2?1-.4*eo((t-13.5)/.4):0);
 });
 const tg=$('#tag');
 tg.innerHTML=t<13.5?'':(t<16.2?'<span class="grn">B sobra mais</span>':'');
 tg.style.opacity=cl((t-13.6)/.2)*(1-cl((t-16)/.2));
 const ex=$('#ex');ex.style.opacity=(t>3.6&&t<16.4)?.8:0;
 const e=$('#end');e.style.opacity=cl((t-16.3)/.3);e.style.transform='scale('+(.94+.06*eo((t-16.3)/.5))+')';
 $('#wm').style.opacity=t<16.3?.7:0;
};
window.render(0);
</script></body></html>
