<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--H);overflow:hidden;background:#111;color:#fff;font-family:B;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.8)}
.sh{position:absolute;inset:0;background:linear-gradient(rgba(10,11,12,.93),rgba(10,11,12,.6) 40%,rgba(10,11,12,.55) 60%,rgba(10,11,12,.95))}
.y{color:#f2b705}.g{color:#5fd39a}
.tag{position:absolute;left:50%;transform:translateX(-50%);background:#6d28d9;color:#fff;font:800 38px/1 BC;padding:14px 26px 10px;border-radius:12px;text-transform:uppercase;letter-spacing:1px;white-space:nowrap}
h1{position:absolute;left:50px;right:50px;font:800 96px/.95 BC;text-transform:uppercase;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.ph{position:absolute;left:50%;transform:translateX(-50%) rotate(-2deg);border-radius:44px;border:12px solid #1c1f23;overflow:hidden;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.8)}
.ph img{display:block;width:100%}
.hl{position:absolute;border:6px solid #f2b705;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.18)}
.bub{position:absolute;background:#fff;color:#16181b;font:700 34px/1.2 B;padding:18px 24px;border-radius:30px 30px 30px 8px;box-shadow:0 14px 40px rgba(0,0,0,.55);max-width:330px}
.foot{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.pill{background:#f2b705;color:#16181b;font:800 56px/1 BC;padding:18px 50px 10px;border-radius:999px;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sm{font:700 28px B;text-transform:uppercase;letter-spacing:1px;color:#e8e4da;text-shadow:0 2px 10px #000}
.ex{font:600 20px B;color:#b9b6ad;letter-spacing:.5px;text-transform:uppercase}
</style></head><body>
<img id="bg"><div class="sh"></div><div id="w"></div>
<script>
const q=new URLSearchParams(location.search), id=q.get('id'), tall=q.get('f')==='916', H=tall?1920:1350;
document.documentElement.style.setProperty('--H',H+'px');
const T=tall?230:0, pw=tall?500:420, py=tall?640:325, sc=(pw-24)/1170;
const foot=`<div class="foot" style="bottom:${tall?330:40}px"><div class="pill">R$ 24,90 por mês</div><div class="sm">7 dias de garantia · Pix ou cartão</div><div class="ex">Números de exemplo · confira antes de salvar</div></div>`;
const phone=(img,crop,hl)=>`<div class="ph" style="top:${py}px;width:${pw}px;height:${Math.round(crop*sc)+24}px"><img src="telas-ia/${img}">${hl?`<div class="hl" style="left:${hl[0]*sc}px;top:${hl[1]*sc}px;width:${hl[2]*sc}px;height:${hl[3]*sc}px"></div>`:''}</div>`;
const C={
fala:{bg:'foto1.jpg',h:`<div class="tag" style="top:${T+50}px">Novo: IA no app</div>
<h1 style="top:${T+120}px">Não gosta de digitar?<br><span class="y">Fala que o app anota.</span></h1>
${phone('03-form-preenchido.png',tall?1780:2050,[30,985,1110,290])}
<div class="bub" style="left:${tall?30:22}px;top:${py+(tall?260:200)}px">🎤 “Abasteci 300 litros a 6 e 19”</div>
<div class="bub" style="right:${tall?30:22}px;top:${py+(tall?560:470)}px;background:#5fd39a;border-radius:30px 30px 8px 30px">Você confere<br>e salva ✓</div>${foot}`},
frete:{bg:'foto6.jpg',h:`<div class="tag" style="top:${T+50}px">Novo: IA no app</div>
<h1 style="top:${T+120}px">Perguntei pro app:<br><span class="y">esse frete compensa?</span></h1>
${phone('06-chat-frete.png',tall?1780:2050,[25,1225,1120,270])}
<div class="bub" style="left:${tall?30:22}px;top:${py+(tall?200:150)}px">R$ 6.000<br>1.000 km<br>volta vazio</div>
<div class="bub" style="right:${tall?30:22}px;top:${py+(tall?600:500)}px;background:#e0533a;color:#fff;border-radius:30px 30px 8px 30px">Não compensa:<br>perderia R$ 1.060</div>${foot}`},
sobrou:{bg:'foto4.jpg',h:`<div class="tag" style="top:${T+50}px">Novo: IA no app</div>
<h1 style="top:${T+120}px">Quanto sobrou<br>este mês? <span class="g">Pergunta.</span></h1>
${phone('05-chat-sobrou.png',tall?1780:2050,[40,950,1000,600])}
<div class="bub" style="right:${tall?30:22}px;top:${py+(tall?700:560)}px;background:#5fd39a;border-radius:30px 30px 8px 30px">A IA responde<br>com os <u>seus</u><br>números</div>${foot}`}
};
const c=C[id]; document.getElementById('bg').src='fotos/'+c.bg; document.getElementById('w').innerHTML=c.h;
</script></body></html>
