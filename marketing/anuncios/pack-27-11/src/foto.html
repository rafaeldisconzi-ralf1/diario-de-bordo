<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:B6;src:url(fonts/barlow-latin-600-normal.woff2)}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:var(--H);overflow:hidden;background:#111;color:#fff;font-family:B;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sh{position:absolute;left:0;right:0}
.top{top:0;height:var(--TH);background:linear-gradient(rgba(10,11,12,.92),rgba(10,11,12,.75) 55%,transparent)}
.bot{bottom:0;height:var(--BH);background:linear-gradient(transparent,rgba(10,11,12,.8) 40%,rgba(10,11,12,.95))}
.y{color:#f2b705}.g{color:#5fd39a}
h1{position:absolute;left:60px;right:60px;top:var(--T);font:800 112px/.94 BC;text-transform:uppercase;text-align:center;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.sub{position:absolute;left:70px;right:70px;text-align:center;font:700 42px/1.2 B;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.foot{position:absolute;left:0;right:0;bottom:var(--Bo);display:flex;flex-direction:column;align-items:center;gap:14px}
.pill{background:#f2b705;color:#16181b;font:800 64px/1 BC;padding:20px 54px 12px;border-radius:999px;text-transform:uppercase;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.sm{font:700 32px B;text-transform:uppercase;letter-spacing:1px;color:#e8e4da;text-shadow:0 2px 10px #000}
.ph{position:absolute;border-radius:36px;border:10px solid #1c1f23;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.btns{position:absolute;left:60px;right:60px;display:flex;gap:20px}
.bt{flex:1;border-radius:26px;padding:34px 8px 26px;text-align:center;font:800 56px/1 BC;text-transform:uppercase;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.q{background:rgba(32,44,51,.94);border-radius:8px 30px 30px 30px;padding:28px 36px;font:600 42px/1.3 B6;color:#eef;margin-bottom:22px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.q.v{background:rgba(25,70,50,.94)}
.price{position:absolute;left:0;right:0;text-align:center}
</style></head><body>
<img id="bg"><div class="sh top"></div><div class="sh bot"></div><div id="w"></div>
<script>
const q=new URLSearchParams(location.search), id=q.get('id'), tall=q.get('f')==='916', H=tall?1920:1350;
const r=document.documentElement.style;
r.setProperty('--H',H+'px');r.setProperty('--T',(tall?290:64)+'px');r.setProperty('--Bo',(tall?440:56)+'px');
r.setProperty('--TH',(tall?900:620)+'px');r.setProperty('--BH',(tall?1000:520)+'px');
const OFF='<div class="pill">R$ 24,90 por mês</div><div class="sm">7 dias de garantia · Pix ou cartão</div>';
const ph=(x,y,w,h,pos)=>`<div class="ph" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="07-sobrou-full.png" style="object-position:${pos}"></div>`;
const T=tall?240:0; // deslocamento 9:16
const C={
sobrou:{f:1,pos:'50% 70%',h:`<h1 style="font-size:100px">Quanto <span class="g">sobrou</span> da<br>sua última viagem?</h1>
 <div class="sub" style="top:${tall?560:300}px">Lance frete, diesel, gastos e diárias.<br>O app faz a conta.</div>
 ${ph(tall?40:70,tall?760:470,tall?320:380,tall?480:420,tall?'0 41%':'0 38%')}`},
papel:{f:2,pos:'50% 60%',h:`<h1>Ainda anota<br>a viagem <span class="y">no papel?</span></h1>
 <div class="sub" style="bottom:${tall?640:250}px">No celular, diesel, gastos e diárias<br>somam sozinhos. No fim: <span class="g">quanto sobrou.</span></div>`},
toque:{f:3,pos:'50% 60%',h:`<h1>Abasteceu?<br><span class="y">Um toque.</span></h1>
 <div class="btns" style="bottom:${tall?640:250}px">
  <div class="bt" style="background:#2163b3">Abasteci</div><div class="bt" style="background:#c4410f">Gastei</div><div class="bt" style="background:#11796f">Diária</div></div>`},
preco:{f:4,pos:'50% 70%',h:`<h1 style="font-size:96px">Custa menos<br>que esse <span class="y">cafezinho</span></h1>
 <div class="price" style="bottom:${tall?600:250}px"><div style="font:800 200px/.9 BC;color:#f2b705;text-shadow:0 6px 30px rgba(0,0,0,.7)">R$ 0,83</div><div style="font:800 64px BC;text-transform:uppercase">por dia</div></div>`},
diaria:{f:5,pos:'50% 75%',h:`<h1 style="font-size:100px">Parado esperando<br><span class="y">descarga?</span></h1>
 <div class="sub" style="top:${tall?520:290}px">Lance as diárias e veja sua comissão<br>e o que ainda falta receber.</div>
 ${ph(tall?600:640,tall?820:560,380,tall?400:330,'0 92%')}`},
depo2:{f:4,pos:'50% 60%',h:`<h1 style="font-size:96px">“Tá me <span class="g">salvando</span><br>demais”</h1>
 <div style="position:absolute;left:60px;right:60px;top:${tall?560:300}px">
  <div class="q">“Anoto o diesel, pedágio, almoço, tudo da viagem, bem na hora, sem complicação.”</div>
  <div class="q v">“Já até passei pros parceiros aqui do posto. A galera também vai baixar.”</div>
  <div class="sm" style="text-align:center;font-size:26px">Mensagens reais de motoristas que usam o app</div></div>`},
jeitos:{f:3,pos:'50% 60%',h:`<h1 style="font-size:96px">3 jeitos de <span class="g">sobrar</span><br>mais no frete</h1>
 <div style="position:absolute;left:60px;right:60px;top:${tall?560:290}px">
  <div class="q"><b class="y">1.</b> Saiba quanto custa cada km antes de fechar</div>
  <div class="q v"><b class="y">2.</b> Coloque a volta vazia na conta <span style="font-size:30px;opacity:.85">(quase ninguém faz)</span></div>
  <div class="q"><b class="y">3.</b> Lance parcela e seguro: veja a sobra de verdade</div></div>`},
depo:{f:6,pos:'50% 75%',h:`<h1 style="font-size:92px">“Agora sei quanto<br><span class="g">sobrou</span> no frete”</h1>
 <div style="position:absolute;left:60px;right:60px;top:${tall?560:300}px">
  <div class="q">“Antes eu anotava diesel e pedágio em papel e depois me perdia todo. Agora lanço na hora.”</div>
  <div class="q v">“O relatório das viagens é top! Me ajuda a saber se a viagem deu lucro.”</div>
  <div class="sm" style="text-align:center;font-size:26px">Mensagens reais de motoristas que usam o app</div></div>`}
};
const c=C[id]; const bg=document.getElementById('bg'); bg.src='fotos/foto'+c.f+'.jpg'; bg.style.objectPosition=c.pos;
document.getElementById('w').innerHTML=c.h+'<div class="foot">'+OFF+'</div>';
</script></body></html>
