<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#16181b;font-family:B;color:#f4f3ee}
#bg{position:absolute;inset:-100px;background:repeating-linear-gradient(-45deg,rgba(242,183,5,.045) 0 3px,transparent 3px 44px)}
#glow{position:absolute;left:-200px;top:250px;width:1480px;height:1200px;background:radial-gradient(ellipse,rgba(242,183,5,.10),transparent 60%)}
.abs{position:absolute;opacity:0}
.yel{color:#f2b705}.grn{color:#5fd39a}.red{color:#ff6b5b}.gr{color:#c9c5ba}
#wm{position:absolute;left:0;right:0;top:80px;text-align:center;font:700 36px B;opacity:.7}
.tag{left:50%;font:800 54px BC;letter-spacing:5px;color:#16181b;background:#f2b705;padding:10px 36px 4px;border-radius:12px;white-space:nowrap;text-transform:uppercase}
.chip{left:50%;font:800 66px BC;text-transform:uppercase;color:#f4f3ee;border:5px solid #f2b705;border-radius:999px;padding:12px 50px 6px;white-space:nowrap}
.chip.r{border-color:#ff6b5b;color:#ff6b5b}.chip.g{border-color:#5fd39a;color:#5fd39a}
.big{left:40px;right:40px;text-align:center;font:800 150px/.98 BC;text-transform:uppercase}
#ze{position:absolute;left:280px;top:330px;width:520px;transform-origin:50% 0;opacity:0}
#ze svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 20px rgba(0,0,0,.5))}
.cm{left:70px;right:70px;min-height:200px;border-radius:30px;background:#22252a;display:flex;align-items:center;justify-content:space-between;padding:20px 50px;gap:30px}
.cm .l{font:800 64px/1.05 BC;text-transform:uppercase;color:#c9c5ba}
.cm .v{font:800 120px/1 BC;white-space:nowrap}
.cm.bg{border:5px solid #5fd39a}.cm.by{border:5px solid #f2b705}.cm.br{border:5px solid #ff6b5b}
.n{left:70px;width:200px;height:200px;border-radius:50%;background:#f2b705;color:#16181b;font:800 170px/1 BC;display:flex;align-items:center;justify-content:center;padding-top:18px}
.nt{left:300px;right:60px;font:800 96px/1 BC;text-transform:uppercase}
.badge{left:50%;background:#5fd39a;color:#16181b;font:800 60px BC;padding:10px 30px 4px;border-radius:14px;text-transform:uppercase;white-space:nowrap}
.badge.r{background:#ff6b5b}
.row{left:70px;right:70px;display:flex;justify-content:space-between;align-items:baseline;font:800 78px BC;text-transform:uppercase;padding:14px 10px;border-bottom:3px solid #2b2e34}
.ab{width:330px;height:330px;border-radius:50%;background:#22252a;border:10px solid #f2b705;display:flex;align-items:center;justify-content:center;font:800 260px/1 BC;color:#f2b705;padding-top:30px}
.ph{left:190px;top:280px;width:700px;height:1040px;border-radius:70px;background:#0c0d0f;border:14px solid #2b2e34;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.55)}
.ph img{width:100%;display:block}
.app{background:#efede8;color:#1d1f22;height:100%;font-family:B}
.app .hd{background:#2b2e34;color:#f4f3ee;padding:30px 34px 24px}
.app .hd small{display:block;color:#f2b705;font:700 24px B;letter-spacing:2px}
.app .hd b{font:800 56px/1 BC;text-transform:uppercase}
.app .bd{padding:26px 30px}
.btn{border-radius:22px;color:#fff;font:700 34px B;text-align:center;padding:26px 10px;margin-bottom:18px;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.fld{background:#fff;border-radius:16px;padding:16px 22px;margin-bottom:14px;font:700 26px B;color:#6b6e73}
.fld b{display:block;color:#1d1f22;font:800 50px BC}
.bub{border-radius:26px;padding:20px 24px;font:700 30px/1.3 B;margin-bottom:16px;opacity:0}
#sub{position:absolute;left:30px;right:30px;top:1400px;height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font:800 92px/1 BC;text-transform:uppercase;-webkit-text-stroke:12px #080a09;paint-order:stroke fill;opacity:0;flex-wrap:wrap;z-index:5}
#sub span{display:inline-block;margin:0 .13em;color:#f4f3ee}
#sub span.on{color:#f2b705;transform:scale(1.08)}
#ft{position:absolute;left:0;right:0;top:1300px;text-align:center;font:700 32px B;color:#c9c5ba;text-transform:uppercase;letter-spacing:2px;opacity:0}
#end{position:absolute;inset:0;background:#16181b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0;padding-bottom:300px;z-index:6}
#ico{width:240px;height:240px;border-radius:52px}
#en{font:800 110px BC;text-transform:uppercase}
#el{font:800 88px/1.05 BC;text-transform:uppercase;text-align:center}
#ep{background:#f2b705;color:#16181b;font:800 96px BC;padding:24px 70px 16px;border-radius:999px;text-transform:uppercase}
#es{font:700 44px B;text-transform:uppercase;color:#c9c5ba;letter-spacing:1px}
</style></head><body>
<div id="bg"></div><div id="glow"></div><div id="wm">@appdiariodebordo</div>
<div id="ze">%%ZE%%</div>
%%HTML%%
<div id="ft">números de exemplo</div>
<div id="sub"></div>
<div id="end"><img id="ico" src="icon-512.png"><div id="en">Diário de Bordo</div><div id="el">%%EL%%</div><div id="ep">%%EP%%</div><div id="es">%%ES%%</div></div>
<script>
const $=s=>document.querySelector(s);
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmi=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const TOT=%%TOT%%;
const PH=%%PH%%;
const ZE=%%ZEV%%;
const END=%%END%%, FT=%%FT%%;
// legendas: cada frase em pedaços de até 4 palavras, tempo por sílabas
const syl=w=>Math.max(1,(w.toLowerCase().match(/[aeiouáéíóúâêôãõà]+/g)||[]).length);
const CH=[];
PH.forEach(([a,b,s])=>{const ws=s.split(/\s+/).filter(Boolean);const tw=ws.reduce((q,w)=>q+syl(w),0);let acc=0;const groups=[];
 for(let i=0;i<ws.length;i+=4)groups.push(ws.slice(i,i+4));if(groups.length>1&&groups[groups.length-1].length==1){const l=groups.pop()[0];groups[groups.length-1].push(l)}
 groups.forEach(g=>{const c={w:[]};g.forEach(w=>{const s0=a+(b-a)*acc/tw;acc+=syl(w);c.w.push({t:w,a:s0,b:a+(b-a)*acc/tw})});c.a=c.w[0].a;c.b=c.w[c.w.length-1].b;CH.push(c)})});
CH.forEach((c,i)=>{const n=CH[i+1];c.show0=c.a-0.04;c.show1=(n&&n.a-c.b<0.45)?n.a-0.04:c.b+0.15;});
let lastCh=-1;
function sub(t){const el=$('#sub');if(t>=END.a){el.style.opacity=0;return}const i=CH.findIndex(c=>t>=c.show0&&t<c.show1);
 if(i<0){el.style.opacity=0;lastCh=-1;return}
 if(i!==lastCh){el.innerHTML=CH[i].w.map(w=>'<span>'+w.t+'</span>').join('');lastCh=i}
 el.style.opacity=1;[...el.children].forEach((s,k)=>{const w=CH[i].w[k];s.className=(t>=w.a&&t<w.b)?'on':''});}
let __t=0;
function vis(id,a,b,fi,fo){fi=fi||.2;fo=fo||.2;const o=(a<=0&&__t<.01?1:cl((__t-a)/fi))*(1-cl((__t-b)/fo));$(id).style.opacity=o;return o}
function pop(id,a,s0,tx){const p=a<=0?1:back((__t-a)/.4);s0=s0||.85;$(id).style.transform=(tx||'')+' scale('+(s0+(1-s0)*p)+')'}
const X='translateX(-50%)';
function slide(id,a,b){$(id).style.opacity=cl((__t-a)/.2)*(b?1-cl((__t-b)/.2):1);$(id).style.transform='translateX('+(-40*(1-eo((__t-a)/.3)))+'px)'}
function cnt(id,a,dur,from,to,pre,suf){$(id).textContent=(pre||'')+fmi(from+(to-from)*eo((__t-a)/dur))+(suf||'')}
function face(ex){['calm','worried','shock','happy'].forEach(k=>{const e=document.getElementById('ex_'+k),m=document.getElementById('mo_'+k);if(e)e.style.display=k===ex?'':'none';if(m)m.style.display=k===ex?'':'none'})}
function A(t){%%ANIM%%}
window.render=function(t){__t=t;
 $('#bg').style.transform='translate('+(-(t*14)%62)+'px,'+(-(t*14)%62)+'px)';
 const z=$('#ze');let zo=0,zt='',ex='calm';
 for(const [a,b,e,top,sc] of ZE){if(t>=a-0.01&&t<b+0.3){zo=(a<=0?1:cl((t-a)/.25))*(1-cl((t-b)/.25));zt='translateY('+((top||0)+30*(1-eo((t-a)/.5)))+'px) scale('+((sc||1)*(0.9+0.1*(a<=0?1:back((t-a)/.5))))+')';ex=e}}
 z.style.opacity=zo;z.style.transform=zt;face(ex);
 A(t);
 const e=$('#end');e.style.opacity=cl((t-END.a)/.3);e.style.transform='scale('+(.94+.06*eo((t-END.a)/.5))+')';
 $('#ep').style.transform='scale('+(1+0.04*Math.sin(t*6)*cl(t-END.a-.5))+')';
 $('#ft').style.opacity=(t>FT[0]&&t<FT[1])?.9:0;
 $('#wm').style.opacity=t>END.a?0:.7;
 sub(t);
};
window.render(0);
</script></body></html>
