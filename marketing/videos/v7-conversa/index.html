<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(fonts/barlow-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:B;src:url(fonts/barlow-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#16181b;font-family:B;color:#f4f3ee}
#chat{position:absolute;inset:0}
#bg{position:absolute;inset:0;background:
 repeating-linear-gradient(135deg,rgba(255,255,255,.018) 0 40px,transparent 40px 80px),#16181b}
#head{position:absolute;left:0;right:0;top:0;height:250px;background:#22252a;display:flex;align-items:flex-end;padding:0 48px 36px;gap:30px;z-index:5;border-bottom:3px solid #f2b705}
#av{width:130px;height:130px;border-radius:50%;background:#f2b705;color:#16181b;font:800 74px BC;display:flex;align-items:center;justify-content:center}
#nm{font:700 58px B;line-height:1}
#st{font:600 38px B;color:#9aa0a6;margin-top:12px;height:46px}
#st.ty{color:#f2b705}
#area{position:absolute;left:0;right:0;top:250px;bottom:0;overflow:hidden}
#col{position:absolute;left:0;right:0;top:0;padding:0 44px}
.m{display:flex;margin-top:34px}
.m.z{justify-content:flex-end}
.b{max-width:830px;padding:26px 34px 18px;border-radius:38px;font:600 56px/1.18 B;position:relative;transform-origin:bottom left}
.m.z .b{background:#f2b705;color:#16181b;border-bottom-right-radius:10px;transform-origin:bottom right}
.m.c .b{background:#2c3036;border-bottom-left-radius:10px}
.t{display:block;text-align:right;font:600 28px B;opacity:.55;margin-top:6px}
.g{color:#5fd39a;font-weight:800}
.big{font:800 70px/1.05 B}
.img{padding:14px 14px 10px}
.img .ph{width:700px;height:940px;border-radius:26px;overflow:hidden;position:relative;background:#fff}
.img .ph img{width:700px;display:block}
#hl{position:absolute;left:44px;right:16px;top:848px;height:88px;border:7px solid #5fd39a;border-radius:20px;opacity:0}
#typ{display:inline-flex;gap:14px;padding:34px 40px}
#typ i{width:22px;height:22px;border-radius:50%;background:#9aa0a6;display:block}
#end{position:absolute;inset:0;background:#16181b;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;z-index:9}
#end .lanes{position:absolute;left:510px;width:60px;top:-400px;bottom:-400px;background:repeating-linear-gradient(#f2b705 0 160px,transparent 160px 360px);opacity:.12}
#eq{font:800 96px/1.02 BC;text-align:center;max-width:920px;text-transform:uppercase}
#eq span{color:#f2b705}
#ico{width:230px;height:230px;border-radius:48px}
#en{font:800 92px BC;text-transform:uppercase;letter-spacing:1px}
#ep{background:#f2b705;color:#16181b;font:800 72px BC;padding:22px 64px;border-radius:999px;text-transform:uppercase}
#es{font:700 46px B;color:#9aa0a6}
#hook{position:absolute;left:60px;right:60px;top:1020px;font:800 104px/1.0 BC;text-transform:uppercase;text-align:center;z-index:6}
#hook span{color:#f2b705}#hook em{font-style:normal;color:#9aa0a6}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:20}
</style></head><body>
<div id="chat">
 <div id="bg"></div>
 <div id="head"><div id="av">C</div><div><div id="nm">Carlos · Scania</div><div id="st">online</div></div></div>
 <div id="area"><div id="col"></div></div>
</div>
<div id="hook">Um caminhoneiro sabe<br>quanto <span>sobrou</span>.<br><em>O outro não.</em></div>
<div id="end"><div class="lanes"></div>
 <div id="eq">E você, sabe quanto <span>sobrou</span>?</div>
 <img id="ico" src="icon-512.png">
 <div id="en">Diário de Bordo</div>
 <div id="ep">Toque no link</div>
 <div id="es">e faça igual ao Carlos</div>
</div>
<div id="fade"></div>
<script>
// [quem, html, tempo, digitando_desde]
const M=[
 ['z','Carlos, quanto sobrou da sua viagem pra São Paulo?',0.25],
 ['c','<span class="big">R$ <span class="g">3.146,90</span></span><br>Limpo.',2.9,1.5],
 ['z','Como você sabe assim, na hora??',4.7],
 ['z','Eu fecho o mês e nunca sei se ganhei ou perdi dinheiro',6.0],
 ['c','Lanço tudo no celular. Frete, diesel, pedágio, diária.',9.4,7.9],
 ['c','IMG',11.9,10.6],
 ['z','Pera... ele faz a conta sozinho?',15.3],
 ['c','Sozinho. Um toque e pronto.',17.6,16.4],
 ['z','E quanto custa isso?',19.1],
 ['c','Menos de <span class="g">R$ 1 por dia</span>.',21.3,20.1],
 ['z','Me manda o link agora!',23.0],
];
const END=24.9, TOT=29.5;
const col=document.getElementById('col'), area=document.getElementById('area');
const hora=['21:14','21:14','21:15','21:15','21:15','21:16','21:16','21:16','21:17','21:17','21:17'];
const els=M.map((m,i)=>{const d=document.createElement('div');d.className='m '+m[0];
 const inner=m[1]=='IMG'?'<div class="b img"><div class="ph"><img src="print.png"><div id="hl"></div></div><span class="t">'+hora[i]+'</span></div>'
 :'<div class="b">'+m[1]+'<span class="t">'+hora[i]+(m[0]=='z'?' ✓✓':'')+'</span></div>';
 d.innerHTML=inner;col.appendChild(d);return d;});
const ty=document.createElement('div');ty.className='m c';ty.innerHTML='<div class="b" id="typ"><i></i><i></i><i></i></div>';col.appendChild(ty);
const st=document.getElementById('st'), hl=()=>document.getElementById('hl');
const cl=(x)=>Math.max(0,Math.min(1,x)), eo=(x)=>1-Math.pow(1-cl(x),3);
const back=(x)=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function bottomOf(el){return el.offsetTop+el.offsetHeight}
window.render=function(t){
 const H=area.clientHeight-40;
 let typing=false, typEl=null;
 // posicionar a "digitação" logo depois da última mensagem visível
 let last=-1; M.forEach((m,i)=>{if(t>=m[2])last=i});
 let next=M[last+1];
 if(next&&next[3]!==undefined&&t>=next[3]&&t<next[2])typing=true;
 // reorganiza: digitação fica depois da última visível
 if(typing){col.insertBefore(ty,els[last+1]);}else{col.appendChild(ty);}
 els.forEach((e,i)=>{const m=M[i];const k=(t-m[2])/0.32;const b=e.firstChild;
  if(t<m[2]){e.style.visibility='hidden';e.style.display=i>last+1?'none':'flex';return}
  e.style.visibility='visible';e.style.display='flex';
  b.style.transform='scale('+(0.6+0.4*back(k))+')';b.style.opacity=cl(k*2);});
 ty.style.display=typing?'flex':'none';
 if(typing){const k=(t-next[3])/0.25;ty.firstChild.style.transform='scale('+(0.6+0.4*back(k))+')';
  [...ty.querySelectorAll('i')].forEach((d,j)=>{d.style.transform='translateY('+(-10*Math.max(0,Math.sin((t*7-j*0.9))))+'px)'})}
 // a próxima ainda não aparecida ocupa espaço só depois de surgir: esconder do fluxo
 if(last+1<els.length)els[last+1].style.display='none';
 st.textContent=typing?'digitando...':'online';st.className=typing?'ty':'';
 // rolagem suave: alvo = fundo do último elemento visível
 const tgt=typing?ty:(last>=0?els[last]:null);
 let target=tgt?Math.max(0,bottomOf(tgt)-H):0;
 // suaviza: interpola a partir do alvo anterior
 const prevT=window._pt===undefined?target:window._pt;
 const y=prevT+(target-prevT)*0.35; window._pt=y;
 col.style.transform='translateY('+(-y)+'px)';
 // destaque na sobra do print
 const iI=5; if(t>M[iI][2]+0.9&&hl()){const k=(t-M[iI][2]-0.9)/0.35;hl().style.opacity=cl(k)*(0.75+0.25*Math.sin(t*8));}
 {const q=document.getElementById('hook');const a=eo((t-0.1)/0.4),b=cl((t-4.0)/0.35);q.style.opacity=cl((t-0.1)/0.25)*(1-b);q.style.transform='translateY('+(80*(1-a)-60*b)+'px)';
  const em=q.querySelector('em');em.style.opacity=cl((t-1.0)/0.25);}
 // tela final
 const e=document.getElementById('end');const k=(t-END)/0.4;e.style.opacity=cl(k);
 document.getElementById('chat').style.transform='scale('+(1-0.06*eo(k))+')';
 const pop=(id,t0,dy)=>{const q=document.getElementById(id);const a=(t-t0)/0.45;q.style.opacity=cl(a*2);q.style.transform='translateY('+(dy*(1-eo(a)))+'px) scale('+(0.7+0.3*back(a))+')'};
 pop('eq',END+0.15,60);pop('ico',END+1.6,0);pop('en',END+1.9,60);pop('ep',END+2.4,60);pop('es',END+2.9,40);
 if(t>END+3.2){document.getElementById('ep').style.transform='scale('+(1+0.05*Math.sin((t-END-3.2)*6))+')'}
 document.querySelector('#end .lanes').style.transform='translateY('+((t*700)%360)+'px)';
 document.getElementById('fade').style.opacity=cl((t-(TOT-0.4))/0.4);
};
window.TOT=TOT; window.MSG=M; window.END=END;
</script></body></html>
