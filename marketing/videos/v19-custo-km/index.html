<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(fonts/barlow-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:BC;src:url(fonts/barlow-condensed-latin-800-normal.woff2);font-weight:800}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#13241c;font-family:B;color:#f4f3ee}
#bg{position:absolute;inset:-100px;background:radial-gradient(circle,rgba(244,243,238,.08) 3px,transparent 4px);background-size:60px 60px}
#glow{position:absolute;left:-200px;top:300px;width:1480px;height:1100px;background:radial-gradient(ellipse,rgba(95,211,154,.18),transparent 60%)}
.abs{position:absolute;opacity:0}
.yel{color:#f2b705}.grn{color:#5fd39a}.red{color:#ff7a66}
#wm{position:absolute;left:0;right:0;top:80px;text-align:center;font:700 36px B;opacity:.7}
#hook{left:40px;right:40px;top:330px;text-align:center;font:800 140px/.95 BC;text-transform:uppercase}
#odo{left:90px;right:90px;top:900px;height:260px;border-radius:36px;background:#0b1410;border:8px solid #2b3a33;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.dg{width:120px;height:190px;border-radius:16px;background:linear-gradient(#1c2a24,#0e1713 50%,#1c2a24);font:800 160px/190px BC;text-align:center;color:#f4f3ee;overflow:hidden}
.dg.y{color:#f2b705}
#odoL{left:0;right:0;top:1190px;text-align:center;font:800 64px BC;text-transform:uppercase;color:#c9c5ba}
#title{left:40px;right:40px;top:200px;text-align:center;font:800 100px/1 BC;text-transform:uppercase}
#list{left:90px;right:90px;top:400px}
.it{display:flex;justify-content:space-between;align-items:center;background:#0b1410;border-radius:28px;padding:30px 44px;margin-bottom:26px;opacity:0;box-shadow:0 12px 0 rgba(0,0,0,.3)}
.it .n{font:800 70px BC;text-transform:uppercase}.it .s{font:700 34px B;color:#c9c5ba;text-transform:uppercase;letter-spacing:1px}
.it .v{font:800 92px BC;color:#ff7a66;white-space:nowrap}
#tot{left:90px;right:90px;top:1330px;border-radius:36px;background:#f2b705;color:#16181b;text-align:center;padding:30px 20px 18px}
#tot .l{font:800 60px BC;text-transform:uppercase}#tot .v{font:800 190px/1 BC}
#ex{left:0;right:0;top:1820px;text-align:center;font:700 30px B;color:#c9c5ba;text-transform:uppercase;letter-spacing:2px}
#fr{left:60px;right:60px;top:560px;text-align:center}
#fr .a{font:800 110px/1 BC;text-transform:uppercase}
#fr .b{margin-top:50px;font:800 230px/1 BC;color:#ff7a66}
#fr .c{margin-top:40px;font:800 84px/1.05 BC;text-transform:uppercase}
#end{position:absolute;inset:0;background:#16181b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;opacity:0}
#ico{width:260px;height:260px;border-radius:56px}
#en{font:800 120px BC;text-transform:uppercase}
#el{font:800 92px/1.05 BC;text-transform:uppercase;text-align:center}
#ep{background:#f2b705;color:#16181b;font:800 96px BC;padding:24px 70px 16px;border-radius:999px;text-transform:uppercase}
</style></head><body>
<div id="bg"></div><div id="glow"></div><div id="wm">@appdiariodebordo</div>
<div class="abs" id="hook">Quanto custa<br><span class="yel">cada km</span><br>do seu caminhão?</div>
<div class="abs" id="odo"><div class="dg">0</div><div class="dg">0</div><div class="dg">0</div><div class="dg">0</div><div class="dg y">0</div></div>
<div class="abs" id="odoL">km rodados</div>
<div class="abs" id="title">Custo por <span class="yel">1 km</span></div>
<div class="abs" id="list"></div>
<div class="abs" id="tot"><div class="l">Cada km custa</div><div class="v" id="totv">R$ 0,00</div></div>
<div class="abs" id="fr"><div class="a">Frete de <span class="yel">800 km</span><br>precisa pagar mais de</div><div class="b" id="frv">R$ 0</div><div class="c">só pra <span class="red">empatar</span></div></div>
<div class="abs" id="ex">números de exemplo</div>
<div id="end"><img id="ico" src="icon-512.png"><div id="en">Diário de Bordo</div>
 <div id="el">Saiba o <span class="grn">seu</span> custo<br>por km</div><div id="ep">Comenta APP</div>
 <div style="font:700 44px B;text-transform:uppercase;color:#c9c5ba;letter-spacing:1px">e receba o link no direct</div></div>
<script>
const TOT=22, $=s=>document.querySelector(s);
const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const brl=v=>'R$ '+v.toFixed(2).replace('.',',');
const IT=[['Diesel','R$ 6,20 ÷ 2,5 km/l',2.48],['Pneus','desgaste',0.30],['Manutenção','óleo, peças',0.40],['Pedágio','média',0.35]];
const RT=[5.2,6.4,7.6,8.8];
$('#list').innerHTML=IT.map(r=>'<div class="it"><div><div class="n">'+r[0]+'</div><div class="s">'+r[1]+'</div></div><div class="v">+ '+brl(r[2])+'</div></div>').join('');
window.render=function(t){
 $('#bg').style.transform='translate('+(-(t*14)%60)+'px,'+(-(t*8)%60)+'px)';
 const h=$('#hook');h.style.opacity=cl(t/.15)*(1-cl((t-4.4)/.2));h.style.transform='scale('+(.85+.15*back(t/.4))+')';
 const o=$('#odo');o.style.opacity=cl((t-1.2)/.2)*(1-cl((t-4.4)/.2));$('#odoL').style.opacity=o.style.opacity;
 const km=Math.floor(800*eo((t-1.3)/2.6));const s=String(km).padStart(5,'0');o.querySelectorAll('.dg').forEach((d,i)=>d.textContent=s[i]);
 $('#title').style.opacity=cl((t-4.6)/.2)*(1-cl((t-12.3)/.2));
 $('#list').style.opacity=$('#title').style.opacity;
 let sum=0;document.querySelectorAll('.it').forEach((e,i)=>{const p=cl((t-RT[i])/.3);e.style.opacity=p;e.style.transform='translateX('+((1-eo((t-RT[i])/.35))*80)+'px)';if(t>=RT[i])sum+=IT[i][2]*eo((t-RT[i])/.5)});
 const to=$('#tot');to.style.opacity=cl((t-5.0)/.2)*(1-cl((t-12.3)/.2));$('#totv').textContent=brl(sum);
 const big=t>=10;to.style.transform='scale('+(big?1+.06*Math.sin(Math.min(1,(t-10)/.4)*Math.PI):1)+')';
 const f=$('#fr');f.style.opacity=cl((t-12.5)/.2)*(1-cl((t-17.6)/.2));f.style.transform='scale('+(.9+.1*back((t-12.5)/.4))+')';
 $('#frv').textContent='R$ '+Math.round(3.53*800*eo((t-13.4)/1.4)).toLocaleString('pt-BR');
 $('#ex').style.opacity=(t>4.6&&t<17.8)?.85:0;
 const e=$('#end');e.style.opacity=cl((t-17.8)/.3);e.style.transform='scale('+(.94+.06*eo((t-17.8)/.5))+')';
 $('#wm').style.opacity=t<17.8?.7:0;
};
window.render(0);
</script></body></html>
