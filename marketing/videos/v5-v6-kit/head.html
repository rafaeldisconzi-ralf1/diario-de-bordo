<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--night-deep)}
body{font-family:var(--font)}
#bg,#stage{position:absolute;inset:0;overflow:hidden}
.lanes{position:absolute;left:530px;top:760px;width:20px;height:1160px;overflow:hidden;clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
.lane{position:absolute;left:0;top:-360px;width:20px;height:1900px;background:repeating-linear-gradient(180deg,var(--amber) 0 120px,transparent 120px 180px);opacity:.55}
#fade{position:absolute;inset:0;background:var(--night-deep);opacity:0}
#flash{position:absolute;inset:0;pointer-events:none}
.pos{position:absolute;left:0;right:0}
.rule{display:flex;justify-content:center}
.ctr{display:flex;justify-content:center}
#ab{position:absolute;inset:0}
.phone{position:absolute;left:350px;top:150px;width:380px;height:822px;border-radius:64px;background:var(--phone-body);padding:16px;box-shadow:var(--shadow-card-dark)}
.phone img{width:352px;height:762px;border-radius:40px;display:block;margin-top:14px}
#nm .big{font-family:var(--font);font-weight:700;font-size:130px;color:var(--paper);line-height:1.16;letter-spacing:1px}
#nm .small{font-family:var(--font);font-weight:700;font-size:64px;color:var(--amber);line-height:1.16;margin-top:6px}
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;padding-bottom:360px}
#eico{width:300px;height:300px;border-radius:66px;box-shadow:var(--shadow-card-dark)}
#ename{font-family:var(--font);font-weight:700;font-size:140px;color:var(--paper);line-height:1.16}
#epill .hf-pill{font-size:84px;padding:18px 48px}
#esub{font-family:var(--font);font-weight:700;font-size:70px;color:var(--amber);line-height:1.16}
</style>
