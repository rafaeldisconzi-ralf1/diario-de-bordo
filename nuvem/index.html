<style>
/* Layout: one column phone app. Big touch targets, one action per button, bottom tab bar. Road-sign amber on asphalt neutrals. */
:root{
  --bg:#eeede8; --surface:#ffffff; --ink:#1d1f22; --muted:#666a70; --line:#d9d7cf;
  --sign:#f2b705; --sign-ink:#1d1f22; --road:#2b2e33; --road-ink:#f4f3ee;
  --good:#1f7a4d; --bad:#b3261e; --fuel:#1f5fa8; --go:#1f7a4d;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16181b; --surface:#212428; --ink:#f1f0eb; --muted:#a3a7ad; --line:#33373c;
  --sign:#f2b705; --sign-ink:#1d1f22; --road:#0e0f11; --road-ink:#f4f3ee;
  --good:#4cc38a; --bad:#ff7a70; --fuel:#6aa8f0; --go:#23885a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#212428; --ink:#f1f0eb; --muted:#a3a7ad; --line:#33373c;
  --sign:#f2b705; --sign-ink:#1d1f22; --road:#0e0f11; --road-ink:#f4f3ee;
  --good:#4cc38a; --bad:#ff7a70; --fuel:#6aa8f0; --go:#23885a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--road)}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{background:var(--road);color:var(--road-ink);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 16px;
  display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
header.top h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.02em;margin:0;text-transform:uppercase;line-height:1}
header.top small{display:block;color:var(--sign);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.month{font-family:var(--display);font-size:18px;font-weight:600;opacity:.85}
h2{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.03em;margin:8px 0 0;text-wrap:balance}

.trip-active{border:none;background:var(--sign);color:var(--sign-ink)}
.route{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.route .arrow{opacity:.55;padding:0 4px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--road);color:var(--road-ink)}
.tag.ex{background:var(--line);color:var(--muted)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.nums{font-variant-numeric:tabular-nums}
.big-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fuel);outline-offset:2px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;border-radius:14px;
  background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:18px;text-align:center;padding:12px}
.btn svg{width:34px;height:34px}
.btn.fuel svg{color:var(--fuel)}
.btn.full{grid-column:1/-1;min-height:72px;flex-direction:row;font-size:20px}
.btn.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
.btn.chegada{background:var(--go);color:#fff;border-color:var(--go)}
.btn.start{background:var(--sign);color:var(--sign-ink);border:none;min-height:140px;font-family:var(--display);font-size:30px;text-transform:uppercase;letter-spacing:.03em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .l{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat.lucro{grid-column:1/-1;background:var(--road);color:var(--road-ink);border:none}
.stat.lucro .l{color:var(--sign)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .what{font-weight:600}
.item .when{font-size:14px;color:var(--muted)}
.item .val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--muted)}
.dot.d{background:var(--fuel)}
.muted{color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs button{padding:10px;font-weight:700;font-size:16px;border-radius:10px;color:var(--muted)}
nav.tabs button[aria-current="true"]{color:var(--ink);background:var(--bg)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{font-family:var(--display);font-size:26px;font-weight:800;text-transform:uppercase;margin:0}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600}
label.f span.h{font-weight:400;font-size:14px;color:var(--muted)}
input,select{font:inherit;font-size:20px;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:12px 16px;border-radius:999px;border:2px solid var(--line);font-weight:600;font-size:16px}
.chip[aria-pressed="true"]{background:var(--road);color:var(--road-ink);border-color:var(--road)}
.calc{background:var(--bg);border-radius:12px;padding:12px 14px;font-weight:600}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:4px}
.actions button{min-height:60px;border-radius:12px;font-weight:700;font-size:18px}
.cancel{background:var(--bg)}
.save{background:var(--sign);color:var(--sign-ink)}
.save.dark{background:var(--road);color:var(--road-ink)}
.err{color:var(--bad);font-weight:600;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--road);color:var(--road-ink);
  padding:12px 18px;border-radius:999px;font-weight:600;z-index:30}
.note{font-size:14px;color:var(--muted)}
.link{color:var(--fuel);font-weight:600;text-decoration:underline;padding:4px 0}
.trip{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:14px}
.mini b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.acts3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acts3 .btn{min-height:96px;font-size:17px;padding:10px 4px}
.btn.dia svg{color:var(--good)}
.dot.g{background:var(--good)}
/* botões com cara de botão: cor cheia e borda de baixo mais escura, afundam ao tocar */
.btn.fuel,.btn.gas,.btn.dia,.btn.chegada,.btn.start,.btn.primary{border:none;box-shadow:0 5px 0 var(--edge);margin-bottom:5px;transition:transform .07s ease-out,box-shadow .07s ease-out}
.btn.fuel:active,.btn.gas:active,.btn.dia:active,.btn.chegada:active,.btn.start:active,.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge);filter:none}
.btn.fuel{background:#1f63b5;color:#fff;--edge:#13447e}
.btn.gas{background:#c2410c;color:#fff;--edge:#8a2d07}
.btn.dia{background:#0f766e;color:#fff;--edge:#0a4f4a}
.btn.fuel svg,.btn.gas svg,.btn.dia svg{color:#fff}
.btn.chegada{--edge:#12512f}
.btn.start,.btn.primary{--edge:#a77c00}
@media (prefers-reduced-motion: reduce){.btn.fuel:active,.btn.gas:active,.btn.dia:active,.btn.chegada:active,.btn.start:active,.btn.primary:active{transform:none}}
nav.tabs{gap:8px;padding-top:8px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;font-size:15px;border-radius:12px;color:var(--ink);background:var(--bg);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);margin-bottom:3px}
nav.tabs button svg{width:26px;height:26px}
nav.tabs button[aria-current="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);box-shadow:0 3px 0 #a77c00}
nav.tabs button:active{box-shadow:none;filter:brightness(.92)}
html{touch-action:manipulation}button,a,input,label{touch-action:manipulation}
.aviso{background:color-mix(in srgb,var(--sign) 22%,var(--surface));border-color:var(--sign);font-weight:600}
.login{display:flex;flex-direction:column;gap:14px;margin-top:12px}
.selo.ok{color:var(--good)}.selo.pend{color:var(--muted)}
.btn.rel{background:var(--surface);border:2px solid var(--line);color:var(--ink);min-height:64px;font-size:19px;box-shadow:0 4px 0 var(--line);margin-bottom:4px}
.btn.rel svg{width:28px;height:28px;color:var(--good)}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div><small id="cam">Controle do caminhão</small><h1>Diário de Bordo</h1></div>
    <div class="month" id="mes"></div>
  </header>
  <main id="app" class="wrap"></main>
</div>
<nav class="tabs">
  <button id="tab-inicio" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>Início</button>
  <button id="tab-viagens" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="12" height="9" rx="1"/><path d="M14 10h4l3 3v3h-7z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>Viagens</button>
  <button id="tab-perfil" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</button>
</nav>
<div id="modal"></div>

<script src="/vendor/supabase-2.118.0.js"></script>
<script>
const ICON={
 fuel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16"/><path d="M3 21h13"/><path d="M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 8h5"/></svg>',
 money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/></svg>',
 flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>',
 rel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/></svg>',
 clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
};
const CATS=['Pedágio','Comida','Arla','Despachante','Balança','Manutenção','Adiantamento','Outro'];
// Fora de viagem aparecem também as contas fixas do dono do caminhão
const CATS_FORA=['Parcela do caminhão','Seguro','Imposto','Contador','Manutenção','Comida','Outro'];
// acima disso o app pergunta "está certo?" (não bloqueia)
const LIMITE_GASTO={'Pedágio':800,'Comida':300,'Arla':1500,'Despachante':3000,'Balança':300,'Manutenção':30000,'Adiantamento':30000,'Outro':5000,'Parcela do caminhão':40000,'Seguro':30000,'Imposto':20000,'Contador':3000};
const KEY='diario-bordo-v1';
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(v==null)return NaN;v=String(v).trim().replace(/\s/g,'').replace(/^R\$/i,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');return parseFloat(v)};
const fmtN=(v,d=0)=>(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtIn=x=>x==null||x===''?'':String(Math.round(x*100)/100).replace('.',',');
const mesViagem=t=>(t.status==='fechada'&&t.fim?t.fim:hoje()).slice(0,7);
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const nomeMes=ym=>{const[y,m]=ym.split('-');return MESES[+m-1]+' de '+y};
const dBR=s=>s?s.split('-').reverse().slice(0,2).join('/'):'';
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function exemplo(){return {exemplo:false,trips:[]};}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.trips))S=exemplo();
if(!S.avulsos)S.avulsos=[];
if(!S.perfil)S.perfil={nome:'',modelo:'',placa:'',ano:'',patrao:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};if(typeof agendarSync==='function')agendarSync()};
let authPronto=false;

function calc(t){
  const frete=t.tipo==='km'?(t.valorKm||0)*(t.distancia||0):(t.valorFechado||0);
  const dia=t.itens.filter(i=>i.tipo==='diaria');
  const diarias=dia.reduce((a,i)=>a+i.valor,0),nDias=dia.reduce((a,i)=>a+(i.dias||0),0);
  const receita=frete+diarias;
  const diesel=t.itens.filter(i=>i.tipo==='diesel').reduce((a,i)=>a+i.valor,0);
  const litros=t.itens.filter(i=>i.tipo==='diesel').reduce((a,i)=>a+(i.litros||0),0);
  const gastos=t.itens.filter(i=>i.tipo==='gasto'&&i.cat!=='Adiantamento').reduce((a,i)=>a+i.valor,0);
  const adiant=t.itens.filter(i=>i.cat==='Adiantamento').reduce((a,i)=>a+i.valor,0);
  const comissao=receita*(t.comissao||0)/100;
  const km=t.kmFim&&t.kmIni?t.kmFim-t.kmIni:null;
  return {frete,diarias,nDias,receita,diesel,litros,gastos,adiant,comissao,km,media:km&&litros?km/litros:null,lucro:receita-comissao-diesel-gastos,aReceber:comissao-adiant};
}
const lbl=i=>i.tipo==='diesel'?'Diesel · '+fmtN(i.litros)+' L':i.tipo==='diaria'?'Diária · '+fmtN(i.dias,i.dias%1?1:0)+(i.dias===1?' dia':' dias'):esc(i.cat);
const ativa=()=>S.trips.find(t=>t.status==='aberta');

let view='inicio';
function render(){
  document.getElementById('mes').textContent=new Date().toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  document.getElementById('tab-inicio').setAttribute('aria-current',view==='inicio');
  document.getElementById('tab-viagens').setAttribute('aria-current',view==='viagens');
  document.getElementById('tab-perfil').setAttribute('aria-current',view==='perfil');
  const P=S.perfil;document.getElementById('cam').textContent=[P.modelo,P.placa].filter(Boolean).join(' · ')||'Controle do caminhão';
  const app=document.getElementById('app'),nav=document.querySelector('nav.tabs');
  if(sb&&!authPronto){app.innerHTML='';return}
  if(sb&&!SESS&&!pularLogin){nav.hidden=true;app.innerHTML=telaLogin();bindLogin();return}
  if(SESS&&CONTA&&!CONTA.admin&&diasRestantes()!==null&&diasRestantes()<0){nav.hidden=true;app.innerHTML=telaAssinar();bindAssinar();return}
  nav.hidden=false;
  app.innerHTML=view==='inicio'?inicio():view==='viagens'?viagens():perfil();
  if(view==='perfil')bindPerfil();
  bind();atualizarSelo();
}
function exBanner(){
  return S.exemplo?`<div class="card note">Estes lançamentos são <b>exemplos</b> com os dados de outubro da planilha. <button class="link" data-a="limpar">Apagar exemplos e começar</button></div>`:'';
}
function inicio(){
  const t=ativa();const P=S.perfil;
  let h=P.nome?`<div style="font-family:var(--display);font-size:26px;font-weight:700;margin-top:4px">Olá, ${esc(P.nome.split(' ')[0])}</div>`:`<div class="card" style="display:flex;flex-direction:column;gap:10px"><b>Comece pelo seu perfil</b><span class="muted">Coloque seu nome e o caminhão que você dirige.</span><button class="btn full primary" data-a="perfil" style="min-height:60px">Preencher perfil</button></div>`;
  h+=exBanner()+avisoAcesso();
  if(!t){
    h+=`<button class="btn start" data-a="nova">${ICON.flag}Começar viagem</button>
    <div class="acts3"><button class="btn fuel" data-a="diesel">${ICON.fuel}Abasteci</button><button class="btn gas" data-a="gasto">${ICON.money}Gastei</button><button class="btn dia" data-a="diaria">${ICON.clock}Diária</button></div>`;
    const ym=hoje().slice(0,7),av=S.avulsos.filter(i=>(i.data||'').slice(0,7)===ym);
    if(av.length)h+=`<h2>Gastos fora de viagem</h2>`+itens({id:'avulso',itens:av});
  }else{
    const c=calc(t);
    h+=`<div class="card trip-active" style="display:flex;flex-direction:column;gap:10px">
      <div class="row"><span class="tag">Em viagem</span><span class="nums" style="font-weight:600">desde ${dBR(t.inicio)}</span></div>
      <div class="route">${esc(t.origem)}<span class="arrow">→</span>${esc(t.destino)}</div>
      <div class="row nums" style="font-weight:600"><span>${c.diarias?'Receita':'Frete'} ${brl(c.receita)}</span><span>Gasto até agora ${brl(c.diesel+c.gastos)}</span></div>
    </div>
    <div class="acts3"><button class="btn fuel" data-a="diesel">${ICON.fuel}Abasteci</button><button class="btn gas" data-a="gasto">${ICON.money}Gastei</button><button class="btn dia" data-a="diaria">${ICON.clock}Diária</button></div>
    <button class="btn full chegada" data-a="fechar">${ICON.flag}Cheguei, encerrar viagem</button>
    <button class="link" data-a="editv" data-t="${t.id}" style="align-self:center;font-size:16px">Corrigir dados da viagem (cidades, frete, km)</button>
    <h2>Lançamentos desta viagem</h2>${itens(t)}`;
  }
  h+=resumoMes();
  return h;
}
function itens(t){
  if(!t.itens.length)return `<div class="card muted">Nada lançado ainda. Toque em <b>Abasteci</b>, <b>Gastei</b> ou <b>Diária</b>.</div>`;
  return `<div class="card list">${[...t.itens].reverse().map(i=>`<div class="item">
    <div><div class="what"><span class="dot ${i.tipo==='diesel'?'d':i.tipo==='diaria'?'g':''}"></span>${lbl(i)}</div>
    <div class="when">${dBR(i.data)}${i.obs?' · '+esc(i.obs):''}</div></div>
    <div style="text-align:right"><div class="val ${i.tipo==='diaria'?'pos':''}">${i.tipo==='diaria'?'+ ':''}${brl(i.valor)}</div><div style="display:flex;gap:14px;justify-content:flex-end"><button class="link" style="font-size:15px" data-a="edit" data-t="${t.id}" data-i="${i.id}">editar</button><button class="link" style="font-size:15px" data-a="del" data-t="${t.id}" data-i="${i.id}">apagar</button></div></div></div>`).join('')}</div>`;
}
function resumoMes(){
  const ym=hoje().slice(0,7);
  let ts=S.trips.filter(t=>mesViagem(t)===ym);
  let label='este mês';
  if(!ts.length&&S.exemplo){ts=S.trips;label='outubro (exemplo)'}
  const tot=ts.map(calc).reduce((a,c)=>({frete:a.frete+c.receita,diarias:a.diarias+c.diarias,diesel:a.diesel+c.diesel,gastos:a.gastos+c.gastos,comissao:a.comissao+c.comissao,lucro:a.lucro+c.lucro}),{frete:0,diarias:0,diesel:0,gastos:0,comissao:0,lucro:0});
  const av=S.avulsos.filter(i=>(i.data||'').slice(0,7)===ym);
  const avD=av.filter(i=>i.tipo==='diesel').reduce((a,i)=>a+i.valor,0),avG=av.filter(i=>i.tipo==='gasto'&&i.cat!=='Adiantamento').reduce((a,i)=>a+i.valor,0);
  tot.diesel+=avD;tot.gastos+=avG;tot.lucro-=avD+avG;
  const avDi=av.filter(i=>i.tipo==='diaria'),avR=avDi.reduce((a,i)=>a+i.valor,0),avC=avDi.reduce((a,i)=>a+i.valor*(i.comissao||0)/100,0);
  tot.frete+=avR;tot.diarias+=avR;tot.comissao+=avC;tot.lucro+=avR-avC;
  return `<h2>Resumo ${label===`este mês`?`deste mês`:`de `+label}</h2>
  <div class="stats">
   <div class="stat"><div class="l">Faturamento</div><div class="v">${brl(tot.frete)}</div>${tot.diarias?`<div class="note nums">${brl(tot.diarias)} de diárias</div>`:''}</div>
   <div class="stat"><div class="l">Diesel</div><div class="v">${brl(tot.diesel)}</div></div>
   <div class="stat"><div class="l">Outros gastos</div><div class="v">${brl(tot.gastos)}</div></div>
   ${tot.comissao?`<div class="stat"><div class="l">Motorista</div><div class="v">${brl(tot.comissao)}</div></div>`:''}
   <div class="stat lucro"><div class="l">Sobrou no mês</div><div class="v ${tot.lucro<0?'neg':''}">${brl(tot.lucro)}</div></div>
  </div>`;
}
function perfil(){
  const P=S.perfil;
  // admin (dono do app) não precisa dos dados de motorista e caminhão
  if(CONTA&&CONTA.admin)return blocoConta();
  return `<h2>Motorista</h2><div class="card" style="display:flex;flex-direction:column;gap:14px">
   <label class="f">Seu nome<input id="pn" autocomplete="name" value="${esc(P.nome)}" placeholder="Ex.: Paulo Souza"></label>
   <label class="f"><span>Nome do patrão <span class="h">(opcional)</span></span><input id="pp" autocomplete="off" value="${esc(P.patrao)}"></label></div>
  <h2>Caminhão</h2><div class="card" style="display:flex;flex-direction:column;gap:14px">
   <label class="f">Modelo<input id="pm" autocomplete="off" value="${esc(P.modelo)}" placeholder="Ex.: Volvo FH 460"></label>
   <div class="two"><label class="f">Placa<input id="pl" autocomplete="off" style="text-transform:uppercase" value="${esc(P.placa)}"></label><label class="f"><span>Ano <span class="h">(opcional)</span></span><input id="pa" inputmode="numeric" value="${esc(P.ano)}"></label></div></div>
  <div class="err" id="perr"></div>
  <button class="btn full" id="psave" style="background:var(--sign);color:var(--sign-ink);border:none;min-height:64px">Salvar perfil</button>`+blocoConta();
}
function bindPerfil(){
  if(!document.getElementById('psave'))return;
  document.getElementById('psave').onclick=()=>{
    const nome=v('pn').trim();if(!nome)return document.getElementById('perr').textContent='Coloque seu nome.';
    S.perfil={nome,patrao:v('pp').trim(),modelo:v('pm').trim(),placa:v('pl').trim().toUpperCase(),ano:v('pa').trim()};
    S.sync&&(S.sync.perfilPend=true);save();view='inicio';render();scrollTo(0,0);toast('Perfil salvo');
  };
}
function viagens(){
  const botaoRel=`<button class="btn full rel" data-a="relatorio">${ICON.rel}Gerar relatório do mês</button>`;
  if(!S.trips.length&&!S.avulsos.length)return `<div class="card muted">Nenhuma viagem ainda. Volte ao Início e toque em <b>Começar viagem</b>.</div>`;
  if(!S.trips.length)return botaoRel+`<div class="card muted">Nenhuma viagem ainda. Os gastos fora de viagem entram no relatório.</div>`;
  const grupos={};[...S.trips].reverse().forEach(t=>{const k=mesViagem(t);(grupos[k]=grupos[k]||[]).push(t)});
  return exBanner()+botaoRel+Object.keys(grupos).sort().reverse().map(k=>{const sobra=grupos[k].reduce((a,t)=>a+calc(t).lucro,0);
   return `<div class="row" style="margin-top:8px"><h2 style="margin:0">${nomeMes(k)}</h2><span class="nums muted" style="font-weight:600">${grupos[k].length} ${grupos[k].length===1?'viagem':'viagens'} · sobra <span class="${sobra<0?'neg':'pos'}">${brl(sobra)}</span></span></div>`+grupos[k].map(cartao).join('')}).join('');
}
function cartao(t){const c=calc(t);return `<button class="card trip" data-a="ver" data-t="${t.id}">
   <div class="row"><span class="tag ${t.status==='aberta'?'':'ex'}">${t.status==='aberta'?'Em viagem':'Encerrada'}</span><span class="muted nums">${dBR(t.inicio)}${t.fim?' a '+dBR(t.fim):''}</span></div>
   <div class="route" style="font-size:24px">${esc(t.origem)}<span class="arrow">→</span>${esc(t.destino)}</div>
   <div class="mini"><div class="muted">Receita<b style="color:var(--ink)">${brl(c.receita)}</b></div><div class="muted">Gastos<b style="color:var(--ink)">${brl(c.diesel+c.gastos)}</b></div><div class="muted">Sobra<b class="${c.lucro<0?'neg':'pos'}">${brl(c.lucro)}</b></div></div>
  </button>`}

/* sheets */
function open(html,onSave){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}<div class="err" id="err"></div>
   <div class="actions"><button class="cancel" id="x">Voltar</button>${onSave?'<button class="save" id="ok">Salvar</button>':''}</div></div></div>`;
  m.querySelector('#x').onclick=close;
  m.querySelector('.scrim').onclick=e=>{if(e.target.classList.contains('scrim'))close()};
  const ACEITOS=new Set(),okB=m.querySelector('#ok'),errEl=m.querySelector('#err');
  const limpa=()=>{if(okB&&okB.dataset.ac){delete okB.dataset.ac;okB.textContent='Salvar';errEl.innerHTML=''}};
  if(onSave)okB.onclick=()=>{
    if(okB.dataset.ac)ACEITOS.add(okB.dataset.ac);
    const r=onSave(ACEITOS);
    if(r&&typeof r==='object'){
      errEl.innerHTML=`<div class="aviso">⚠️ ${r.msg}${r.fix?`<button class="fix" id="fixit">${r.fix.rotulo}</button>`:''}</div>`;
      okB.dataset.ac=r.key;okB.textContent='Sim, está certo';
      const fx=errEl.querySelector('#fixit');if(fx)fx.onclick=()=>{const i=document.getElementById(r.fix.id);i.value=r.fix.valor;i.dispatchEvent(new Event('input',{bubbles:true}));i.focus()};
      errEl.scrollIntoView({block:'nearest',behavior:'smooth'});return}
    if(r){limpa();errEl.textContent=r;return}
    close();render()};
  // mostra por extenso o que foi digitado (R$ 2.000,00 · 350 L · 15%)
  m.querySelectorAll('input[data-moeda],input[data-un]').forEach(i=>{
    const e=document.createElement('div');e.className='eco';i.insertAdjacentElement('afterend',e);
    const up=()=>{const n=num(i.value);e.textContent=!i.value.trim()||isNaN(n)?'':i.dataset.moeda!==undefined?'= '+brl(n):'= '+fmtN(n,n%1?1:0)+' '+i.dataset.un};
    i.addEventListener('input',up);up()});
  m.querySelectorAll('input').forEach(i=>i.addEventListener('input',limpa));
  m.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',limpa));
  const f=m.querySelector('input');if(f)setTimeout(()=>f.focus(),50);
}
/* conferência de valores: devolve o primeiro aviso ainda não confirmado */
function confere(aceitos,lista){for(const a of lista)if(a&&a.se&&!aceitos.has(a.key))return a;return null}
const semVirgula=id=>!/[.,]/.test(v(id));
const dividido=(id,n,min,max)=>{const x=num(v(id))/n;return semVirgula(id)&&x>=min&&x<=max?x:null};
const fixVal=(id,x,txt)=>({id,valor:String(Math.round(x*100)/100).replace('.',','),rotulo:txt||('Corrigir para '+brl(x))});
function repetido(itens,item){const agora=Date.now();return itens.some(i=>i.criado&&agora-i.criado<10*60e3&&i.tipo===item.tipo&&Math.abs(i.valor-item.valor)<0.005&&(i.cat||'')===(item.cat||''))}
function close(){document.getElementById('modal').innerHTML=''}
const v=id=>document.getElementById(id)?.value;
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
const lastKm=()=>{const ks=S.trips.map(t=>t.kmFim||t.kmIni).filter(Boolean);return ks.length?Math.max(...ks):''};

function novaViagem(E,fromDetail){
  const ed=E||null,X=ed||{};
  open(`<h3>${ed?'Corrigir viagem':'Começar viagem'}</h3>
   <div class="two"><label class="f">Saindo de<input id="o" autocomplete="off" placeholder="Cidade" value="${esc(X.origem||'')}"></label><label class="f">Indo para<input id="d" autocomplete="off" placeholder="Cidade" value="${esc(X.destino||'')}"></label></div>
   <label class="f">${ed?'Km no painel na saída':'Km no painel agora'}<input id="ki" inputmode="numeric" data-un="km" value="${ed?ed.kmIni:lastKm()}"></label>
   ${ed&&ed.status==='fechada'?`<label class="f">Km no painel na chegada<input id="kf2" inputmode="numeric" data-un="km" value="${ed.kmFim||''}"></label>`:''}
   <label class="f">Como é o frete?</label>
   <div class="chips"><button class="chip" aria-pressed="${X.tipo!=='fechado'}" data-tipo="km">Por km</button><button class="chip" aria-pressed="${X.tipo==='fechado'}" data-tipo="fechado">Valor fechado</button></div>
   <div id="tkm" class="two" ${X.tipo==='fechado'?'hidden':''}><label class="f">Distância (km)<input id="dist" inputmode="numeric" data-un="km" value="${X.distancia||''}"></label><label class="f">R$ por km<input id="vkm" inputmode="decimal" placeholder="8,76" data-moeda value="${fmtIn(X.valorKm||null)}"></label></div>
   <label class="f" id="tfe" ${X.tipo==='fechado'?'':'hidden'}>Valor do frete (R$)<input id="vf" inputmode="decimal" data-moeda value="${fmtIn(X.valorFechado||null)}"></label>
   <div class="calc" id="prev">Frete: R$ 0,00</div>
   <label class="f">Comissão do motorista (%)<span class="h">O que foi combinado com o dono do caminhão. Se o caminhão é seu, deixe 0.</span><input id="com" inputmode="decimal" data-un="%" value="${ed?fmtIn(ed.comissao||0):S.trips.length?S.trips[S.trips.length-1].comissao:0}"></label>`,
  (ac)=>{
    const tipo=document.querySelector('[data-tipo][aria-pressed="true"]').dataset.tipo;
    const t={id:uid(),origem:v('o').trim(),destino:v('d').trim(),kmIni:num(v('ki')),tipo,distancia:num(v('dist'))||0,valorKm:num(v('vkm'))||0,valorFechado:num(v('vf'))||0,comissao:num(v('com'))||0,inicio:hoje(),fim:null,status:'aberta',itens:[]};
    if(!t.origem||!t.destino)return 'Preencha de onde sai e para onde vai.';
    if(!(t.kmIni>0))return 'Coloque o km que está no painel.';
    if(tipo==='km'&&!(t.valorKm>0&&t.distancia>0))return 'Coloque a distância e o valor por km.';
    if(tipo==='fechado'&&!(t.valorFechado>0))return 'Coloque o valor do frete.';
    if(t.comissao>100)return 'A comissão é em porcentagem, de 0 a 100.';
    const frete=tipo==='km'?t.valorKm*t.distancia:t.valorFechado,vk=dividido('vkm',100,0.5,40),vf=dividido('vf',100,200,100000);
    const a=confere(ac,[
      {se:tipo==='km'&&t.valorKm>40,key:'vkm-alto',msg:`${brl(t.valorKm)} por km parece alto.${vk?` Você quis dizer ${brl(vk)}?`:''}`,fix:vk&&fixVal('vkm',vk)},
      {se:tipo==='km'&&t.valorKm<0.5,key:'vkm-baixo',msg:`${brl(t.valorKm)} por km parece pouco. Confere o valor?`},
      {se:tipo==='km'&&t.distancia>6000,key:'dist',msg:`${fmtN(t.distancia)} km de distância é muito. Confere?`},
      {se:tipo==='fechado'&&t.valorFechado<200,key:'vf-baixo',msg:`Frete de ${brl(t.valorFechado)} parece pouco. Confere o valor?`},
      {se:frete>100000,key:'frete-alto',msg:`Frete de ${brl(frete)} parece alto.${tipo==='fechado'&&vf?` Você quis dizer ${brl(vf)}?`:''}`,fix:tipo==='fechado'&&vf&&fixVal('vf',vf)},
      {se:t.comissao>50,key:'com',msg:`Comissão de ${fmtN(t.comissao,t.comissao%1?1:0)}% parece alta. Confere?`}]);
    if(a)return a;
    if(ed){
      const kf2=document.getElementById('kf2')?num(v('kf2')):null;
      if(kf2!==null&&!(kf2>t.kmIni))return 'O km de chegada precisa ser maior que o de saída.';
      Object.assign(ed,{origem:t.origem,destino:t.destino,kmIni:t.kmIni,tipo:t.tipo,distancia:t.distancia,valorKm:t.valorKm,valorFechado:t.valorFechado,comissao:t.comissao});
      if(kf2!==null)ed.kmFim=kf2;
      save();setTimeout(()=>{toast('Viagem corrigida');if(fromDetail)detalhe(ed.id)});return}
    S.trips.push(t);save();setTimeout(()=>toast('Viagem iniciada. Boa estrada!'));
  });
  const upd=()=>{const tipo=document.querySelector('[data-tipo][aria-pressed="true"]').dataset.tipo;
    const f=tipo==='km'?(num(v('dist'))||0)*(num(v('vkm'))||0):(num(v('vf'))||0);document.getElementById('prev').textContent='Frete: '+brl(f)};
  document.querySelectorAll('[data-tipo]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tipo]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.getElementById('tkm').hidden=b.dataset.tipo!=='km';document.getElementById('tfe').hidden=b.dataset.tipo==='km';upd()});
  ['dist','vkm','vf'].forEach(i=>document.getElementById(i).oninput=upd);upd();
}
function abasteci(ed){
  const t=ed?ed.t:(ativa()||{itens:S.avulsos}),I=ed?ed.item:{};
  open(`<h3>${ed?'Corrigir abastecimento':'Abasteci'}</h3>
   <div class="two"><label class="f">Litros<input id="l" inputmode="decimal" data-un="L" value="${fmtIn(I.litros)}"></label><label class="f">R$ por litro<input id="p" inputmode="decimal" placeholder="6,79" data-moeda value="${fmtIn(I.preco)}"></label></div>
   <div class="calc" id="tot">Total: R$ 0,00</div>
   <label class="f"><span>Posto <span class="h">(opcional)</span></span><input id="obs" autocomplete="off" value="${esc(I.obs||'')}"></label>`,
  (ac)=>{const l=num(v('l')),p=num(v('p'));if(!(l>0&&p>0))return 'Coloque os litros e o preço do litro.';
    const item={id:uid(),tipo:'diesel',litros:l,preco:p,valor:Math.round(l*p*100)/100,data:hoje(),obs:v('obs').trim(),criado:Date.now()};
    const pc=dividido('p',100,3,12)||dividido('p',1000,3,12);
    const a=confere(ac,[
      {se:p>15,key:'p-alto',msg:`${brl(p)} o litro parece alto. O diesel costuma ficar entre R$ 5 e R$ 9.${pc?` Você quis dizer ${brl(pc)}?`:''}`,fix:pc&&fixVal('p',pc)},
      {se:p<3,key:'p-baixo',msg:`${brl(p)} o litro parece pouco. Confere o preço?`},
      {se:l>1500,key:'l-alto',msg:`${fmtN(l)} litros é muito para um abastecimento. Confere?`},
      {se:l<5,key:'l-baixo',msg:`Só ${fmtN(l,l%1?1:0)} litros? Confere?`},
      {se:!ed&&repetido(t.itens,item),key:'rep',msg:`Você já lançou um abastecimento de ${brl(item.valor)} agora há pouco. Lançar de novo?`}]);
    if(a)return a;
    if(ed){Object.assign(ed.item,{litros:l,preco:p,valor:item.valor,obs:item.obs});save();ed.depois();return}
    t.itens.push(item);save();setTimeout(()=>toast('Abastecimento salvo'))});
  const u=()=>document.getElementById('tot').textContent='Total: '+brl((num(v('l'))||0)*(num(v('p'))||0));
  document.getElementById('l').oninput=u;document.getElementById('p').oninput=u;u();
}
function gastei(ed){
  const t=ed?ed.t:(ativa()||{itens:S.avulsos}),I=ed?ed.item:{};let cat=I.cat||'';
  const fora=t.itens===S.avulsos,lista=fora?CATS_FORA.concat(I.cat&&!CATS_FORA.includes(I.cat)?[I.cat]:[]):CATS.concat(I.cat&&!CATS.includes(I.cat)?[I.cat]:[]);
  open(`<h3>${ed?'Corrigir gasto':fora?'Gasto fora de viagem':'Gastei'}</h3><label class="f">Com o quê?</label>
   <div class="chips">${lista.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${c}">${c}</button>`).join('')}</div>
   <label class="f">Valor (R$)<input id="val" inputmode="decimal" data-moeda value="${fmtIn(I.valor)}"></label>
   ${fora?`<label class="f"><span>Dia do gasto <span class="h">(se não foi hoje, troque)</span></span><input id="dg" type="date" max="${hoje()}" value="${I.data||hoje()}"></label>`:''}
   <label class="f"><span>Observação <span class="h">(opcional)</span></span><input id="obs" autocomplete="off" value="${esc(I.obs||'')}"></label>`,
  (ac)=>{const val=num(v('val'));if(!cat)return 'Escolha com o que gastou.';if(!(val>0))return 'Coloque o valor.';
    const dia=fora?(v('dg')||hoje()):(I.data||hoje());if(dia>hoje())return 'Essa data ainda não chegou. Confira o dia.';
    const velho=(new Date(hoje())-new Date(dia))/864e5>60;
    const item={id:uid(),tipo:'gasto',cat,valor:val,data:dia,obs:v('obs').trim(),criado:Date.now()};
    const lim=LIMITE_GASTO[cat]||5000,fx=dividido('val',100,1,lim);
    const a=confere(ac,[
      {se:val>lim,key:'alto',msg:`${brl(val)} com ${cat.toLowerCase()} parece muito.${fx?` Você quis dizer ${brl(fx)}?`:''}`,fix:fx&&fixVal('val',fx)},
      {se:val<1,key:'baixo',msg:`${brl(val)} parece pouco. Confere o valor?`},

  const st=p=>{const a=[p.teste_ate,p.pago_ate].filter(Boolean).sort().pop();const d=a?Math.round((new Date(a+'T12:00:00')-new Date(hoje()+'T12:00:00'))/864e5):null;
    return {a,d,txt:(p.pago_ate&&p.pago_ate>=hoje()?'Pago':'Teste')+(a?(d<0?' · venceu ':' · até ')+dBR(a):'')}};
  el.className='';el.innerHTML=`<div class="note">${data.length} ${data.length===1?'conta':'contas'}</div>`+data.map(p=>{const s=st(p);return `<div class="card" style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
    <b>${esc(p.nome||'(sem nome)')}</b><span class="muted" style="word-break:break-all">${esc(p.email||'')}</span>
    <span class="${s.d!==null&&s.d<0?'neg':''}" style="font-weight:600">${s.txt}</span>
    <span class="note">Último uso: ${p.visto_em?new Date(p.visto_em).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):'—'}</span>
    <button class="chip" data-lib="${p.id}" data-nome="${esc(p.nome||p.email)}">Recebi o Pix: liberar +30 dias</button></div>`}).join('');
  el.querySelectorAll('[data-lib]').forEach(b=>b.onclick=()=>{
    if(b.dataset.conf){b.disabled=true;sb.rpc('liberar_dias',{usuario:b.dataset.lib,dias:30}).then(({data:nova,error})=>{if(error){b.textContent='Erro, tente de novo';b.disabled=false;return}
      toast('Liberado até '+dBR(nova));if(SESS&&b.dataset.lib===SESS.user.id)carregarConta();painelAdmin()});return}
    b.dataset.conf='1';b.textContent='Toque de novo para confirmar ('+b.dataset.nome+')';b.style.borderColor='var(--good)'});
}


/* corrige erros comuns de digitação no e-mail (gmail.comll, gmial.com, hotmail.con…) */
function sugestaoEmail(e){
  const m=e.match(/^([^@\s]+)@([^@\s]+)$/);if(!m)return null;let [,u,d]=m;
  const certos={'gmail.com':['gmial.com','gmai.com','gmal.com','gamil.com','gmail.co','gmail.cm','gnail.com','gmaill.com','gmail.comm','gmail.con','gmail.om','gmail.c'],
    'hotmail.com':['hotmal.com','hotmai.com','hotmial.com','hotmail.co','hotmail.con','hotmil.com','hotmaill.com'],
    'outlook.com':['outlok.com','outllok.com','outlook.co','outlook.con','oulook.com'],
    'yahoo.com.br':['yaho.com.br','yahoo.combr','yahoo.com.b'],'icloud.com':['iclod.com','icloud.co','icloud.con']};
  for(const [ok,errs] of Object.entries(certos)){
    if(d===ok)return null;
    // "gmail.comll", "gmail.com.", "gmail.com123": sobrou coisa depois do .com
    if(d.startsWith(ok)&&d.length>ok.length&&!(ok.endsWith('.com')&&d===ok+'.br'))return u+'@'+ok;
    if(errs.includes(d))return u+'@'+ok;
  }
  return null;
}

/* NOTIFICAÇÕES (Web Push) */
const AVISOS_URL=SB_URL+'/functions/v1/avisos';
const temPush=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const ehIphone=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
const instalado=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
let NOTIF=null; // 'on' | 'off' | 'bloqueado' | 'sem'
async function estadoNotif(){
  if(!temPush())return NOTIF='sem';
  if(Notification.permission==='denied')return NOTIF='bloqueado';
  try{const r=await navigator.serviceWorker.ready;const s=await r.pushManager.getSubscription();NOTIF=s&&Notification.permission==='granted'?'on':'off'}catch(e){NOTIF='off'}
  return NOTIF;
}
function blocoNotif(){
  if(NOTIF===null){estadoNotif().then(()=>{if(view==='perfil')render()});return ''}
  if(NOTIF==='sem')return ehIphone()&&!instalado()
    ?`<div class="card note" style="font-size:16px">Para receber avisos no iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. Depois abra o app pelo ícone.</div>`:'';
  if(NOTIF==='on')return `<div class="card list"><div class="item"><span>Notificações</span><b style="color:var(--good)">Ligadas</b></div></div>
    <button class="link" data-a="notif" style="align-self:center">Desligar notificações</button>`;
  if(NOTIF==='bloqueado')return `<div class="card note" style="font-size:16px"><b>Notificações bloqueadas.</b> Para ligar: toque no cadeado ao lado do endereço (ou em Configurações do celular), procure <b>Notificações</b> e escolha <b>Permitir</b>.</div>`;
  return `<button class="btn full start" data-a="notif" style="min-height:60px;font-size:20px">🔔 Ativar notificações</button>
    <div class="note" style="text-align:center;margin-top:-4px">Você recebe aviso antes do acesso vencer e novidades do app.</div>`;
}
function b64u(s){const p='='.repeat((4-s.length%4)%4),b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function chamarAvisos(corpo){
  const {data}=await sb.auth.getSession();const t=data.session&&data.session.access_token;
  const r=await fetch(AVISOS_URL,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,...(t?{Authorization:'Bearer '+t}:{})},body:JSON.stringify(corpo)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||'erro');return j;
}
async function ativarNotif(){
  if(!SESS)return;
  const reg=await navigator.serviceWorker.ready;
  if(NOTIF==='on'){
    const s=await reg.pushManager.getSubscription();
    if(s){await sb.from('push_inscricoes').delete().eq('endpoint',s.endpoint);await s.unsubscribe()}
    NOTIF='off';toast('Notificações desligadas');render();return;
  }
  if(!navigator.onLine)return toast('Precisa de internet para ativar');
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){NOTIF=perm==='denied'?'bloqueado':'off';render();return}
    const {chave}=await chamarAvisos({acao:'chave'});
    let s=await reg.pushManager.getSubscription();
    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(chave)});
    const j=s.toJSON();
    const {error}=await sb.from('push_inscricoes').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,user_id:SESS.user.id},{onConflict:'endpoint'});
    if(error)throw error;
    NOTIF='on';render();toast('Notificações ligadas');
    chamarAvisos({acao:'teste'}).catch(()=>{});
  }catch(e){console.error(e);toast('Não deu para ativar agora. Tente de novo.')}
}
function mandarAviso(){
  open(`<h3>Aviso para todos</h3>
   <label class="f"><span>Título</span><input id="avT" maxlength="60" value="Diário de Bordo"></label>
   <label class="f"><span>Mensagem</span><textarea id="avM" maxlength="180" rows="3" style="font:inherit;font-size:18px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)"></textarea></label>
   <button class="save" id="avOk" style="min-height:60px;border-radius:12px;font-weight:700;font-size:18px">Enviar</button>`,null);
  const ok=document.getElementById('avOk');
  ok.onclick=async()=>{const texto=document.getElementById('avM').value.trim();if(!texto)return toast('Escreva a mensagem');
    ok.disabled=true;ok.textContent='Enviando…';
    try{const j=await chamarAvisos({acao:'enviar',titulo:document.getElementById('avT').value.trim(),texto});close();toast('Enviado para '+j.enviadas+(j.enviadas===1?' celular':' celulares'))}
    catch(e){ok.disabled=false;ok.textContent='Enviar';toast(e.message||'Não deu para enviar')}};
}

  sb.auth.getSession().then(({data})=>{authPronto=true;if(data.session)aoEntrar(data.session);else render()}).catch(()=>{authPronto=true;pularLogin=true;render()});
